<div class="min-h-screen flex items-center justify-center bg-[var(--bg-main)] p-4 font-sans animate-fade-in">

    <div
        class="w-full max-w-md bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl shadow-xl overflow-hidden relative">

        <div class="h-2 w-full bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)]"></div>

        <div class="p-8">

            <div class="text-center mb-8">
                <div
                    class="w-12 h-12 bg-[var(--bg-input)] rounded-xl flex items-center justify-center mx-auto mb-4 border border-[var(--border-color)] text-[var(--color-primary)] text-2xl">
                    <i class="ri-shield-keyhole-line" *ngIf="step === 1"></i>
                    <i class="ri-mail-send-line" *ngIf="step === 2"></i>
                    <i class="ri-lock-password-line" *ngIf="step === 3"></i>
                </div>
                <h2 class="text-2xl font-black text-[var(--text-main)] tracking-tight">Recuperar Acceso</h2>
                <p class="text-sm text-[var(--text-muted)] mt-1">
                    <span *ngIf="step === 1">Ingresa tu correo para buscar tu cuenta.</span>
                    <span *ngIf="step === 2">Hemos enviado un código a {{ emailForm.get('email')?.value }}</span>
                    <span *ngIf="step === 3">Crea una contraseña segura.</span>
                </p>
            </div>

            <div class="flex gap-2 mb-8">
                <div class="h-1 flex-1 rounded-full transition-colors duration-500"
                    [ngClass]="step >= 1 ? 'bg-[var(--color-primary)]' : 'bg-[var(--bg-input)]'"></div>
                <div class="h-1 flex-1 rounded-full transition-colors duration-500"
                    [ngClass]="step >= 2 ? 'bg-[var(--color-primary)]' : 'bg-[var(--bg-input)]'"></div>
                <div class="h-1 flex-1 rounded-full transition-colors duration-500"
                    [ngClass]="step >= 3 ? 'bg-[var(--color-primary)]' : 'bg-[var(--bg-input)]'"></div>
            </div>

            <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="handleEmailSubmit()"
                class="space-y-5 animate-slide-up">

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ml-1">Correo
                        Electrónico</label>
                    <div class="relative group/input">
                        <i
                            class="ri-mail-line absolute left-4 top-3.5 text-[var(--text-muted)] group-focus-within/input:text-[var(--color-primary)] transition-colors"></i>
                        <input formControlName="email" type="email" placeholder="ejemplo@correo.com"
                            class="w-full bg-[var(--bg-input)] border border-[var(--border-color)] rounded-xl pl-10 pr-4 py-3 text-[var(--text-main)] outline-none focus:border-[var(--color-primary)] focus:ring-1 focus:ring-[var(--color-primary)] transition-all">
                    </div>
                    <p *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched"
                        class="text-[var(--color-error)] text-xs ml-1">Correo inválido</p>
                </div>

                <button type="submit" [disabled]="emailForm.invalid || isLoading"
                    class="w-full bg-[var(--color-primary)] hover:brightness-110 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-[var(--color-primary)]/30 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span *ngIf="!isLoading">Enviar Código</span>
                    <span *ngIf="isLoading"><i class="ri-loader-4-line animate-spin"></i> Enviando...</span>
                </button>

            </form>

            <form *ngIf="step === 2" [formGroup]="codeForm" (ngSubmit)="handleCodeSubmit()"
                class="space-y-5 animate-slide-up">

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ml-1">Código de
                        Seguridad</label>
                    <input formControlName="code" type="text" maxlength="6" placeholder="000000"
                        class="w-full bg-[var(--bg-input)] border border-[var(--border-color)] rounded-xl text-center py-4 text-[var(--text-main)] text-2xl font-mono tracking-[0.5em] font-bold outline-none focus:border-[var(--color-primary)] focus:ring-1 focus:ring-[var(--color-primary)] transition-all placeholder:tracking-normal placeholder:text-sm">
                    <p class="text-xs text-center text-[var(--text-muted)]">Revisa tu bandeja de entrada o spam.</p>
                </div>

                <button type="submit" [disabled]="codeForm.invalid || isLoading"
                    class="w-full bg-[var(--color-primary)] hover:brightness-110 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-[var(--color-primary)]/30 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span *ngIf="!isLoading">Verificar Código</span>
                    <span *ngIf="isLoading"><i class="ri-loader-4-line animate-spin"></i> Verificando...</span>
                </button>

                <button type="button" (click)="step = 1"
                    class="w-full text-xs font-bold text-[var(--text-muted)] hover:text-[var(--text-main)] transition-colors">
                    ¿Correo incorrecto? Volver atrás
                </button>

            </form>

            <form *ngIf="step === 3" [formGroup]="passwordForm" (ngSubmit)="handlePasswordSubmit()"
                class="space-y-5 animate-slide-up">

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ml-1">Nueva
                        Contraseña</label>
                    <div class="relative group/input">
                        <i
                            class="ri-lock-line absolute left-4 top-3.5 text-[var(--text-muted)] group-focus-within/input:text-[var(--color-primary)] transition-colors"></i>
                        <input formControlName="password" [type]="showPass ? 'text' : 'password'"
                            placeholder="Mínimo 6 caracteres"
                            class="w-full bg-[var(--bg-input)] border border-[var(--border-color)] rounded-xl pl-10 pr-10 py-3 text-[var(--text-main)] outline-none focus:border-[var(--color-primary)] focus:ring-1 focus:ring-[var(--color-primary)] transition-all">
                        <button type="button" (click)="showPass = !showPass"
                            class="absolute right-3 top-3.5 text-[var(--text-muted)] hover:text-[var(--text-main)]">
                            <i [class]="showPass ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                        </button>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider ml-1">Confirmar
                        Contraseña</label>
                    <div class="relative group/input">
                        <i
                            class="ri-lock-check-line absolute left-4 top-3.5 text-[var(--text-muted)] group-focus-within/input:text-[var(--color-primary)] transition-colors"></i>
                        <input formControlName="confirmPassword" [type]="showPass ? 'text' : 'password'"
                            placeholder="Repite la contraseña"
                            class="w-full bg-[var(--bg-input)] border border-[var(--border-color)] rounded-xl pl-10 pr-10 py-3 text-[var(--text-main)] outline-none focus:border-[var(--color-primary)] focus:ring-1 focus:ring-[var(--color-primary)] transition-all">
                    </div>
                    <p *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched"
                        class="text-[var(--color-error)] text-xs ml-1">Las contraseñas no coinciden</p>
                </div>

                <button type="submit" [disabled]="passwordForm.invalid || isLoading"
                    class="w-full bg-[var(--color-primary)] hover:brightness-110 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-[var(--color-primary)]/30 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span *ngIf="!isLoading">Cambiar Contraseña</span>
                    <span *ngIf="isLoading"><i class="ri-loader-4-line animate-spin"></i> Actualizando...</span>
                </button>

            </form>

        </div>

        <div class="bg-[var(--bg-input)] p-4 text-center border-t border-[var(--border-color)]">
            <a routerLink="/auth/login"
                class="text-sm font-bold text-[var(--text-muted)] hover:text-[var(--color-primary)] transition-colors flex items-center justify-center gap-2">
                <i class="ri-arrow-left-line"></i> Volver al Login
            </a>
        </div>

    </div>
</div>
